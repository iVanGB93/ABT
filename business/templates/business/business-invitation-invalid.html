{% extends 'web/base.html' %}
{% load static %}
{% block body %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h3 class="mb-4 text-center text-danger">
                    {% if message %}
                        {{ message }}
                    {% else %}
                        Code {{ code }} not valid
                    {% endif %}
                    </h3>
                    <p class="text-center text-muted mb-4">
                        The entered code is not valid. Please try again.
                    </p>
                    <form action="{% url 'business:business_invitation_form' %}" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="text" name="code" class="form-control" placeholder="Invitation code" required maxlength="50">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Intentar de nuevo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock body %}
